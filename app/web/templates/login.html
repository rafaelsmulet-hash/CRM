{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<div class="login-wrap">
  <div class="card">
    <h1>Jarvis</h1>
    <p class="subtitulo">Monitoramento de estruturas de derivativos</p>
    {% if erro %}<div class="msg-erro">{{ erro }}</div>{% endif %}
    <form class="form-vertical" method="post" action="/auth/login">
      <label>E-mail
        <input type="email" name="email" required autofocus>
      </label>
      <label>Senha
        <input type="password" name="senha" required>
      </label>
      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
