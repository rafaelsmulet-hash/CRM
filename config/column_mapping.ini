; Mapeamento das colunas do arquivo exportado pelo Orbit para os campos
; internos do Jarvis. Os nomes à direita são os nomes de coluna REAIS do seu
; arquivo Orbit — ajuste-os aqui, no seu ambiente, sem precisar mexer em
; código. Os valores abaixo são um ponto de partida assumido (padrão comum em
; planilhas de estruturas de derivativos), não confirmados com uma amostra
; real do Orbit — a primeira importação real provavelmente vai exigir ajustes
; aqui.
;
; Campos obrigatórios: cliente_codigo, cliente_nome, operacao_ref,
; tipo_estrutura, ativo_principal, data_inicio, data_vencimento.
; Campos opcionais (ficam NULL se a coluna não existir ou vier vazia):
; notional, moeda, valor_entrada, barreira_1_nivel, barreira_1_tipo,
; barreira_1_regra_observacao, fixing_1_data, fixing_1_tipo,
; preco_ativo, preco_data.

[colunas]
cliente_codigo = Codigo Cliente
cliente_nome = Nome Cliente
operacao_ref = Numero Operacao
tipo_estrutura = Produto
ativo_principal = Ativo Referencia
notional = Notional
moeda = Moeda
data_inicio = Data Operacao
data_vencimento = Data Vencimento
valor_entrada = Valor Investido
barreira_1_nivel = Barreira Nivel
barreira_1_tipo = Barreira Tipo
barreira_1_regra_observacao = Barreira Regra Observacao
fixing_1_data = Data Fixing
fixing_1_tipo = Tipo Fixing
preco_ativo = Preco Atual Ativo
preco_data = Data Preco

[geral]
formato_data = %d/%m/%Y
separador_decimal = ,
