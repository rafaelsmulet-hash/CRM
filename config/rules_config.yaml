# Configuração do motor de regras. Ajuste os valores abaixo sem precisar
# tocar em código Python. O motor roda automaticamente após cada importação
# (ver rules/engine.py).

# Regra 1: tempo decorrido desde o fechamento da operação.
# Dispara um follow-up (uma única vez por limiar) quando o número de meses
# desde data_fechamento atinge cada valor da lista.
regra_tempo_decorrido:
  ativa: true
  meses: [1, 3, 6, 12]

# Regra 2: proximidade do vencimento.
# Dispara um follow-up (uma única vez por limiar) quando faltam N dias ou
# menos para data_vencimento (e o vencimento ainda não passou).
regra_vencimento_proximo:
  ativa: true
  dias_antes: [30, 15, 5]

# Regra 3: evento de mudança de status de barreira.
# Dispara sempre que status_barreira mudar de valor entre duas importações
# consecutivas para a mesma operação (ex: "nao_observada" -> "tocada").
# status_relevantes: se a lista NÃO estiver vazia, só dispara quando o NOVO
# status estiver nesta lista. Deixe [] para disparar em qualquer mudança.
regra_evento_barreira:
  ativa: true
  status_relevantes: []
