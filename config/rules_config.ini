; Configuração do motor de regras do Jarvis. Ajuste os valores abaixo sem
; precisar tocar em código Python. O motor roda automaticamente após cada
; importação (ver rules/engine.py). Nada aqui envia mensagem nenhuma —
; só decide quando preparar um RASCUNHO de follow-up para sua revisão.

; Regra 1: tempo decorrido desde o fechamento da operação.
; Dispara um follow-up (uma única vez por limiar) quando o número de meses
; desde data_fechamento atinge cada valor da lista "meses" (separados por vírgula).
[regra_tempo_decorrido]
ativa = true
meses = 1,3,6,12

; Regra 2: proximidade do vencimento.
; Dispara um follow-up (uma única vez por limiar) quando faltam N dias ou
; menos para data_vencimento (e o vencimento ainda não passou).
[regra_vencimento_proximo]
ativa = true
dias_antes = 15

; Regra 3: evento de mudança de status de barreira.
; Dispara sempre que status_barreira mudar de valor entre duas extrações
; consecutivas para a mesma operação (ex: "nao_observada" -> "tocada").
; status_relevantes: se a lista NÃO estiver vazia, só dispara quando o NOVO
; status estiver nesta lista. Deixe vazio para disparar em qualquer mudança.
[regra_evento_barreira]
ativa = true
status_relevantes =

; Usado pelo painel `jarvis hoje` para destacar operações com barreira
; tocada/rompida agora (não gera follow-up sozinho, é só um filtro visual).
; Lista de valores de status_barreira considerados "tocada", separados por vírgula.
[status_barreira_tocada]
valores = tocada,rompida

; Painel `jarvis hoje`: destaca clientes sem sinal de atividade no Jarvis
; há mais de N dias. IMPORTANTE: isso é um PROXY interno (dias desde a
; data_fechamento da operação ativa mais recente do cliente) — não é o
; registro oficial de contato, que vive no CRM da corretora.
[janela_sem_contato]
ativa = true
dias = 30
